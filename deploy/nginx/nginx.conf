# NGINX as a normal user (no sudo). Start from the project root with:
#   nginx -p "$PWD/deploy/nginx/" -c nginx.conf -e "$PWD/logs/nginx_error.log"
# Stop with the same -p/-c plus: -s stop
# All paths below are relative to the prefix (deploy/nginx/). No `user` directive (we are not root).

worker_processes 2;
pid run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;
    client_body_temp_path temp/client_body;
    proxy_temp_path       temp/proxy;
    fastcgi_temp_path     temp/fastcgi;
    uwsgi_temp_path       temp/uwsgi;
    scgi_temp_path        temp/scgi;

    upstream router_app {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        client_max_body_size 16k;      # requests are tiny JSON (<= 500 chars of text)

        location / {
            proxy_pass http://router_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 130s;   # a bit above gunicorn's 120 s timeout
        }
    }
}
